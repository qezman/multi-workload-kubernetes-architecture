apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels: { app: node-agent }
  template:
    metadata:
      labels: { app: node-agent }
    spec:
      containers:
        - name: node-agent
          image: busybox:1.36
          command:
            ["sh", "-c", "while true; do echo alive $(date); sleep 30; done"]
          livenessProbe:
            exec: { command: ["sh", "-c", "echo ok"] }
            initialDelaySeconds: 5
            periodSeconds: 20
