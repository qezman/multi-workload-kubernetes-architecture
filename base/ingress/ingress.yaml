apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service: { name: web-app-svc, port: { number: 80 } }
          - path: /api
            pathType: Prefix
            backend:
              service: { name: postgres, port: { number: 5432 } } # placeholder until real API svc exists
